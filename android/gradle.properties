org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# ═══════════════════════════════════════════════════════════════
# R8 OPTIMISATION (corrige les 3 warnings Play Console)
# ═══════════════════════════════════════════════════════════════

# Active le "full mode" R8 : optimisations agressives
# (class merging, inlining, enum unboxing, member rebinding,
#  suppression du code inutilisé par analyse de flux).
# Sans cette ligne, R8 reste en mode compatibilité
# et n'optimise que ~30% du code → c'est votre cas (33%).
android.enableR8.fullMode=true

# Active le precise shrinking : supprime aussi les ressources
# référencées UNIQUEMENT par du code qui a été supprimé par R8.
# Corrige le warning "Optimized resource shrinking isn't enabled".
android.experimental.enableNewResourceShrinker.preciseShrinking=true

# Désactive le resource shrinker legacy (incompatible avec le precise)
android.enableNewResourceShrinker=true

org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

android.useAndroidX=true
android.enableJetifier=true

# ═══════════════════════════════════════════════════════════════
# R8 OPTIMISATION (corrige les 3 warnings Play Console)
# ═══════════════════════════════════════════════════════════════

# Active le "full mode" R8 : optimisations agressives
android.enableR8.fullMode=true

# Active le precise shrinking
android.experimental.enableNewResourceShrinker.preciseShrinking=true

# Désactive le resource shrinker legacy
android.enableNewResourceShrinker=true

# ═══════════════════════════════════════════════════════════════
# RÉSEAU / TÉLÉCHARGEMENT DES DÉPENDANCES (corrige les 504)
# ═══════════════════════════════════════════════════════════════

# Timeouts HTTP augmentés (décroissance de la connexion)
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.http.connectionTimeout=60000   # fallback si besoin
systemProp.org.gradle.internal.http.socketTimeout=60000

# Nombre de tentatives de retéléchargement
systemProp.org.gradle.internal.repository.max.tentatives=5
systemProp.org.gradle.internal.repository.initial.backoff=500
systemProp.org.gradle.internal.repository.max.backoff=10000

# Force une source Maven plus fiable en cas de problème de téléchargement
systemProp.org.gradle.dependency.verification=off

org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# ═══════════════════════════════════════════════════════════════
# R8 OPTIMISATION (corrige les 3 warnings Play Console)
# ═══════════════════════════════════════════════════════════════

# Active le "full mode" R8 : optimisations agressives
# (class merging, inlining, enum unboxing, member rebinding,
#  suppression du code inutilisé par analyse de flux).
# Sans cette ligne, R8 reste en mode compatibilité
# et n'optimise que ~30% du code → c'est votre cas (33%).
android.enableR8.fullMode=true

# Active le precise shrinking : supprime aussi les ressources
# référencées UNIQUEMENT par du code qui a été supprimé par R8.
# Corrige le warning "Optimized resource shrinking isn't enabled".
android.experimental.enableNewResourceShrinker.preciseShrinking=true

# Désactive le resource shrinker legacy (incompatible avec le precise)
android.enableNewResourceShrinker=true

# ═══════════════════════════════════════════════════════════════
# RÉSEAU / TÉLÉCHARGEMENT DES DÉPENDANCES (corrige la 504)
# ═══════════════════════════════════════════════════════════════

# Augmente les timeouts HTTP de Gradle pour éviter les échecs
# "504 Gateway Time-out" lors du téléchargement des JARs
# (ex: kotlin-compiler-embeddable-2.2.20.jar) depuis Maven Central
# ou GitHub, notamment sur les runners GitHub Actions.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000

# Nombre de tentatives de retéléchargement avant abandon
systemProp.org.gradle.internal.repository.max.tentatives=5
systemProp.org.gradle.internal.repository.initial.backoff=500

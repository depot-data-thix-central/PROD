name: thix_id
description: "THIX ID - Une identité numérique sécurisée pour la RDC et l'Afrique"
publish_to: 'none'

version: 2.2.0+4

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ═══════════════════════════════════════════════════════════════════════
  # UI & CORE
  # ═══════════════════════════════════════════════════════════════════════
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  go_router: ^17.4.0
  fl_chart: ^0.70.0
  iconsax: ^0.0.8
  carousel_slider: ^5.0.0
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  flutter_markdown: ^0.7.4

  # ═══════════════════════════════════════════════════════════════════════
  # STATE MANAGEMENT
  # ═══════════════════════════════════════════════════════════════════════
  flutter_riverpod: ^2.6.1
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.21.3+1
  riverpod_annotation: ^2.6.1
  provider: ^6.1.2

  # ═══════════════════════════════════════════════════════════════════════
  # BACKEND & API
  # ═══════════════════════════════════════════════════════════════════════
  supabase_flutter: ^2.8.0
  dio: ^5.7.0
  http: ^1.2.2

  # ═══════════════════════════════════════════════════════════════════════
  # DATABASE & CACHE
  # ═══════════════════════════════════════════════════════════════════════
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  collection: ^1.19.0

  # ═══════════════════════════════════════════════════════════════════════
  # JSON & SERIALIZATION
  # ═══════════════════════════════════════════════════════════════════════
  json_annotation: ^4.9.0
  equatable: ^2.0.8

  # ═══════════════════════════════════════════════════════════════════════
  # UTILS
  # ═══════════════════════════════════════════════════════════════════════
  intl: ^0.20.2
  timeago: ^3.6.0
  timezone: ^0.10.1
  uuid: ^4.5.3
  crypto: ^3.0.3
  convert: ^3.1.1
  url_launcher: ^6.3.0
  any_link_preview: ^3.0.2
  path: ^1.9.0
  highlight: ^0.7.0

  # ═══════════════════════════════════════════════════════════════════════
  # MEDIA & COMMUNICATION
  # ═══════════════════════════════════════════════════════════════════════
  camera: ^0.11.0+2
  video_player: ^2.9.2
  agora_rtc_engine: ^6.5.2
  record: ^7.1.1
  image_picker: ^1.1.2
  audioplayers: ^6.1.0
  audio_service: ^0.18.18
  flutter_rating_bar: ^4.0.1
  flutter_audio_waveforms: ^1.2.1+8
  cached_network_image: ^3.4.1
  wakelock_plus: ^1.2.8
  connectivity_plus: ^6.1.0

  # ═══════════════════════════════════════════════════════════════════════
  # IDENTIFICATION & SCANNING
  # ═══════════════════════════════════════════════════════════════════════
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  nfc_manager: ^4.2.1
  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.4

  # ═══════════════════════════════════════════════════════════════════════
  # NOTIFICATIONS & SHARING
  # ═══════════════════════════════════════════════════════════════════════
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.3.1
  share_plus: ^10.1.2
  app_badge_plus: ^1.1.2
  app_links: ^6.3.2
  # ✅ AJOUTÉ : VoIP natif (CallKit iOS + Telecom Android)
  flutter_callkit_incoming: ^2.0.4
  # ✅ AJOUTÉ : Sonnerie persistante même app fermée
  flutter_ringtone_player: ^4.0.0
  # ✅ AJOUTÉ : Vibration en arrière-plan (pattern WhatsApp)
  vibration: ^2.0.0
  # ✅ AJOUTÉ : Badge d'icône fiable (Samsung, LG, Huawei, Xiaomi, Oppo)
  flutter_app_badger: ^1.5.0

  # ═══════════════════════════════════════════════════════════════════════
  # NOTIFICATIONS PUSH (Firebase)
  # ═══════════════════════════════════════════════════════════════════════
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_crashlytics: ^4.1.3
  firebase_analytics: ^11.3.3
  firebase_performance: ^0.10.0+8

  # ═══════════════════════════════════════════════════════════════════════
  # FILES & PDF
  # ═══════════════════════════════════════════════════════════════════════
  file_picker: ^8.0.0
  printing: ^5.13.0
  pdf: ^3.10.10
  video_thumbnail: ^0.5.3

  # ═══════════════════════════════════════════════════════════════════════
  # AUDIO / DICTÉE
  # ═══════════════════════════════════════════════════════════════════════
  speech_to_text: ^7.4.0

  # ═══════════════════════════════════════════════════════════════════════
  # SÉCURITÉ / CHIFFREMENT
  # ═══════════════════════════════════════════════════════════════════════
  encrypt: ^5.0.3
  local_auth: ^3.0.2
  flutter_secure_storage: ^9.2.2
  zxcvbn: ^1.0.0

  # ═══════════════════════════════════════════════════════════════════════
  # CONTACTS
  # ═══════════════════════════════════════════════════════════════════════
  flutter_contacts: ^2.3.1

  # ═══════════════════════════════════════════════════════════════════════
  # MAPS
  # ═══════════════════════════════════════════════════════════════════════
  google_maps_flutter: ^2.9.0

  # ═══════════════════════════════════════════════════════════════════════
  # THIX MARKET
  # ═══════════════════════════════════════════════════════════════════════
  debounce_throttle: ^2.0.0
  table_calendar: ^3.1.2
  csv: ^7.0.0
  excel: ^4.0.6
  flutter_image_compress: ^2.4.0

  # ═══════════════════════════════════════════════════════════════════════
  # MONITORING & ANALYTICS
  # ═══════════════════════════════════════════════════════════════════════
  sentry_flutter: ^8.9.0
  package_info_plus: ^8.1.0
  device_info_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1
  riverpod_generator: ^2.4.0


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/ringtone.mp3
    - assets/sounds/offline.mp3
    # ✅ AJOUTÉ : Sonnerie iOS CallKit
    - assets/sounds/ringtone.caf
    # ✅ AJOUTÉ : Son notification messages (optionnel)
    - assets/sounds/notification.mp3

name: thix_id
description: "THIX ID - Une identité numérique sécurisée pour la RDC et l'Afrique"
publish_to: 'none'

version: 2.1.0+3

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ═══════════════════════════════════════════════════════════════════════
  # UI & CORE
  # ═══════════════════════════════════════════════════════════════════════
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  go_router: ^17.4.0
  fl_chart: ^0.70.0                    #  UPGRADED : 1.2.0 → 0.70.0 (6+ ans de fixes)
  iconsax: ^0.0.8
  carousel_slider: ^5.0.0
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  flutter_markdown: ^0.7.4
  
  # ═══════════════════════════════════════════════════════════════════════
  # STATE MANAGEMENT (Riverpod uniquement — Provider retiré)
  # ═══════════════════════════════════════════════════════════════════════
  
  flutter_riverpod: ^2.6.1             #  UPGRADED : 2.5.1 → 2.6.1
  hooks_riverpod: ^2.6.1               #  UPGRADED : 2.5.1 → 2.6.1
  flutter_hooks: ^0.21.3+1
  riverpod_annotation: ^2.6.1          #  UPGRADED : 2.3.5 → 2.6.1
  provider: ^6.1.2 
  # ═══════════════════════════════════════════════════════════════════════
  # BACKEND & API
  # ═══════════════════════════════════════════════════════════════════════
  supabase_flutter: ^2.8.0
  dio: ^5.7.0
  http: ^1.2.2

  # ═══════════════════════════════════════════════════════════════════════
  # DATABASE & CACHE
  # ═══════════════════════════════════════════════════════════════════════
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  collection: ^1.19.1

  # ═══════════════════════════════════════════════════════════════════════
  # JSON & SERIALIZATION
  # ═══════════════════════════════════════════════════════════════════════
  json_annotation: ^4.9.0
  equatable: ^2.0.8

  # ═══════════════════════════════════════════════════════════════════════
  # UTILS
  # ═══════════════════════════════════════════════════════════════════════
  intl: ^0.20.2
  timeago: ^3.6.0
  timezone: ^0.10.1
  uuid: ^4.5.3
  crypto: ^3.0.3
  convert: ^3.1.1                      # Hex encoding pour HaveIBeenPwned
  url_launcher: ^6.3.0
  any_link_preview: ^3.0.2             #  UPGRADED : 3.0.0 → 3.0.2 (bug fixes)
  path: ^1.9.0
  highlight: ^0.7.0
  # ═══════════════════════════════════════════════════════════════════════
  # MEDIA & COMMUNICATION
  # ═══════════════════════════════════════════════════════════════════════
  camera: ^0.11.0+2
  video_player: ^2.9.2
  agora_rtc_engine: ^6.5.2
  record: ^7.1.1
  image_picker: ^1.1.2
  audioplayers: ^6.1.0
  flutter_rating_bar: ^4.0.1
  flutter_audio_waveforms: ^1.2.1+8
  cached_network_image: ^3.4.1

  # ═══════════════════════════════════════════════════════════════════════
  # IDENTIFICATION & SCANNING
  # ═══════════════════════════════════════════════════════════════════════
  geolocator: ^13.0.2                  #  DOWNGRADED : 14.0.2 → 13.0.2 (stabilité)
  geocoding: ^3.0.0                    #  DOWNGRADED : 4.0.0 → 3.0.0 (compatibilité)
  nfc_manager: ^4.2.1
  mobile_scanner: ^6.0.2               #  DOWNGRADED : 7.4.0 → 6.0.2 (stabilité)
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.4

  # ═══════════════════════════════════════════════════════════════════════
  # NOTIFICATIONS & SHARING
  # ═══════════════════════════════════════════════════════════════════════
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.3.1          #  DOWNGRADED : 13.0.0 → 11.3.1 (stabilité, retire override)
  share_plus: ^10.0.0

  # ═══════════════════════════════════════════════════════════════════════
  # NOTIFICATIONS PUSH (Firebase)
  # ═══════════════════════════════════════════════════════════════════════
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_crashlytics: ^4.1.3         #  AJOUTÉ : Crash reporting
  firebase_analytics: ^11.3.3          #  AJOUTÉ : Analytics
  firebase_performance: ^0.10.0+8      #  AJOUTÉ : Performance monitoring

  # ═══════════════════════════════════════════════════════════════════════
  # FILES & PDF
  # ═══════════════════════════════════════════════════════════════════════
  file_picker: ^8.0.0
  printing: ^5.13.0
  pdf: ^3.10.10
  video_thumbnail: ^0.5.3

  # ═══════════════════════════════════════════════════════════════════════
  # AUDIO / DICTÉE
  # ═══════════════════════════════════════════════════════════════════════
  speech_to_text: ^7.4.0

  # ═══════════════════════════════════════════════════════════════════════
  # SÉCURITÉ / CHIFFREMENT
  # ═══════════════════════════════════════════════════════════════════════
  encrypt: ^5.0.3                      
  local_auth: ^3.0.2
  flutter_secure_storage: ^9.2.2
  zxcvbn: ^1.0.0                       # Analyse de force des mots de passe

  # ═══════════════════════════════════════════════════════════════════════
  # CONTACTS
  # ═══════════════════════════════════════════════════════════════════════
  flutter_contacts: ^2.3.1

  # ═══════════════════════════════════════════════════════════════════════
  # MAPS
  # ═══════════════════════════════════════════════════════════════════════
  google_maps_flutter: ^2.9.0          #  DOWNGRADED : 2.12.3 → 2.9.0 (stabilité)

  # ═══════════════════════════════════════════════════════════════════════
  # THIX MARKET
  # ═══════════════════════════════════════════════════════════════════════
  debounce_throttle: ^2.0.0
  table_calendar: ^3.1.2
  csv: ^8.0.0
  excel: ^4.0.6
  flutter_image_compress: ^2.4.0

  # ═══════════════════════════════════════════════════════════════════════
  # MONITORING & ANALYTICS
  # ═══════════════════════════════════════════════════════════════════════
  sentry_flutter: ^8.9.0               #  AJOUTÉ : Error tracking
  package_info_plus: ^8.1.0            #  AJOUTÉ : App version info
  device_info_plus: ^10.1.0            #  AJOUTÉ : Device info pour debugging

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0 
  flutter_launcher_icons: ^0.14.3
  build_runner: ^2.4.13                #  CHANGÉ : pin exact → caret (auto-updates)
  json_serializable: ^6.8.0            #  CHANGÉ : pin exact → caret
  hive_generator: ^2.0.1               #  CHANGÉ : pin exact → caret
  riverpod_generator: ^2.4.0            #  UPGRADED : 2.4.0 → 2.6.1 + caret

# ❌ REMOVED : dependency_overrides (plus nécessaire avec downgrade permission_handler)

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    # ❌ REMOVED : lib/l10n/translations/ (traductions codées dans app_localizations.dart)
    - assets/sounds/ringtone.mp3
    - assets/sounds/offline.mp3

  # ═══════════════════════════════════════════════════════════════════════
  # FONTS (optionnel — google_fonts utilisé à la place)

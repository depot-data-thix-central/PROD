name: thix_id
description: "THIX ID - Une identité numérique sécurisée"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Core
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  provider: ^6.1.2
  go_router: ^17.4.0
  fl_chart: ^1.2.0
  iconsax: ^0.0.8
  carousel_slider: ^5.0.0
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  flutter_highlight: ^0.7.0

  # State Management & Hooks
  flutter_riverpod: ^2.5.1
  hooks_riverpod: ^2.5.1
  flutter_hooks: ^0.21.3+1
  riverpod_annotation: ^2.3.5

  # Backend & API
  supabase_flutter: ^2.8.0
  dio: ^5.7.0
  http: ^1.2.2

  # Database & Cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  collection: ^1.19.1

  # JSON & Serialization
  json_annotation: ^4.9.0
  equatable: ^2.0.8

  # Utils
  intl: ^0.20.2
  timeago: ^3.6.0
  timezone: ^0.10.1  
  uuid: ^4.5.3
  crypto: ^3.0.3
  url_launcher: ^6.3.0
  path: ^1.9.0

  # Media & Communication
  video_player: ^2.9.2
  agora_rtc_engine: ^6.5.2
  record: ^7.1.1
  image_picker: ^1.1.2
  audioplayers: ^6.1.0
  flutter_rating_bar: ^4.0.1
  flutter_audio_waveforms: ^1.2.1+8
  cached_network_image: ^3.4.1

  # Identification & Scanning
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  nfc_manager: ^4.2.1
  mobile_scanner: ^7.4.0
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.4

  # Notifications & Sharing
  flutter_local_notifications: ^18.0.1 
  permission_handler: ^13.0.0
  share_plus: ^10.0.0
  
# Notifications Push (Firebase)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  
  # Files & PDF
  file_picker: ^8.0.0
  printing: ^5.13.0
  pdf: ^3.10.10
  video_thumbnail: ^0.5.3

  # Audio / Dictée
  speech_to_text: ^7.4.0

  # Sécurité / Chiffrement
  encrypt: ^5.0.3
  local_auth: ^3.0.2
  flutter_secure_storage: ^9.2.2

  # Contacts
  flutter_contacts: ^2.3.1

  # Maps
  google_maps_flutter: ^2.12.3

  # THIX MARKET
  debounce_throttle: ^2.0.0
  table_calendar: ^3.1.2
  csv: ^8.0.0
  excel: ^4.0.6
  flutter_image_compress: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  build_runner: 2.4.13
  json_serializable: 6.8.0
  hive_generator: 2.0.1
  riverpod_generator: 2.4.0

dependency_overrides:
  permission_handler_android: 13.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - lib/l10n/translations/
    - assets/sounds/ringtone.mp3
    - assets/sounds/offline.mp3

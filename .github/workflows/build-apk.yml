name: Build Flutter APK (Obfuscated)

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub release'
        required: false
        default: 'false'
        type: boolean
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "17"
  SYMBOLS_DIR: "build/app/outputs/symbols"

jobs:
  test-and-analyze:
    name: Test & Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate code (build_runner)
        run: |
          if grep -q "build_runner" pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          else
            echo "No build_runner — skip"
          fi

      - name: Analyze code
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Run tests
        continue-on-error: true
        run: flutter test --coverage || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: flutter
          name: codecov-umbrella
          fail_ci_if_error: false
        continue-on-error: true

  build:
    name: Build Release (Obfuscated)
    runs-on: ubuntu-latest
    needs: test-and-analyze
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate code (build_runner)
        run: |
          if grep -q "build_runner" pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          else
            echo "No build_runner — skip"
          fi

      - name: Setup Android keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          echo "Setting up Android keystore..."

          if [ -z "${KEYSTORE_B64}" ]; then
            echo "Secret ANDROID_KEYSTORE_BASE64 is empty."
            exit 1
          fi
          if [ -z "${STORE_PASSWORD}" ] || [ -z "${KEY_PASSWORD}" ] || [ -z "${KEY_ALIAS}" ]; then
            echo "Missing ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD or ANDROID_KEY_ALIAS."
            exit 1
          fi

          mkdir -p android/app

          printf '%s' "${KEYSTORE_B64}" | tr -d '\n\r\t ' | base64 --decode > android/app/keystore.jks

          if [ ! -s android/app/keystore.jks ]; then
            echo "Decoded keystore is empty. Check ANDROID_KEYSTORE_BASE64."
            exit 1
          fi

          cat > android/key.properties <<EOF
          storePassword=${STORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=keystore.jks
          EOF

          sed -i 's/^[[:space:]]*//' android/key.properties
          echo "Keystore configured ($(wc -c < android/app/keystore.jks) bytes)"

      - name: Extract version from pubspec
        id: version
        run: |
          VERSION=$(grep "^version:" pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          BUILD_NUMBER=$(grep "^version:" pubspec.yaml | awk '{print $2}' | cut -d'+' -f2)

          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "full_version=$VERSION+$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (build $BUILD_NUMBER)"

      # ✅ FIX : Secrets passés via env intermédiaire pour éviter la corruption
      # des caractères spéciaux (+, /, =) dans la clé JWT par le shell bash
      - name: Build release App Bundle (Obfuscated)
        env:
          D_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          D_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build appbundle --release \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ steps.version.outputs.build_number }} \
            --obfuscate \
            --split-debug-info=${{ env.SYMBOLS_DIR }} \
            --dart-define=SUPABASE_URL="$D_SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$D_SUPABASE_ANON_KEY"

      - name: Build release APKs (Obfuscated & Split by ABI)
        env:
          D_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          D_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release --split-per-abi \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ steps.version.outputs.build_number }} \
            --obfuscate \
            --split-debug-info=${{ env.SYMBOLS_DIR }} \
            --dart-define=SUPABASE_URL="$D_SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$D_SUPABASE_ANON_KEY"

      - name: Verify artifacts
        run: |
          test -f build/app/outputs/bundle/release/app-release.aab
          APK_COUNT=$(ls -1 build/app/outputs/flutter-apk/*.apk 2>/dev/null | wc -l)
          test "$APK_COUNT" -gt 0
          echo "Found 1 AAB and $APK_COUNT APKs"

          if [ -d "${{ env.SYMBOLS_DIR }}" ]; then
            echo "Symbols directory found."
            ls -la ${{ env.SYMBOLS_DIR }}
          else
            echo "WARNING: Symbols directory not found!"
          fi

      - name: Generate checksums & Compress symbols
        run: |
          sha256sum build/app/outputs/bundle/release/app-release.aab > build/app/outputs/bundle/release/app-release.aab.sha256

          cd build/app/outputs/flutter-apk
          sha256sum *.apk > checksums.sha256
          cd -

          # Recherche robuste des symboles (Flutter 3.24+)
          SYMBOLS_FOUND=""
          for dir in "build/app/outputs/symbols" "build/debug_info" "build/app/intermediates/merged_java_res/release/out/META-INF"; do
            if [ -d "$dir" ] && [ -n "$(ls -A "$dir" 2>/dev/null)" ]; then
              echo "✅ Found symbols in: $dir"
              SYMBOLS_FOUND="$dir"
              break
            fi
          done

          if [ -n "$SYMBOLS_FOUND" ]; then
            tar -czf build/app/outputs/symbols.tar.gz -C "$(dirname "$SYMBOLS_FOUND")" "$(basename "$SYMBOLS_FOUND")"
            sha256sum build/app/outputs/symbols.tar.gz > build/app/outputs/symbols.tar.gz.sha256
            echo "✅ Symbols compressed successfully"
          else
            echo "⚠️ WARNING: No symbols directory found!"
            find build -name "*.symbols" -type f 2>/dev/null || echo "No .symbols files found"
          fi

      - name: Upload symbols to Firebase Crashlytics
        if: github.event_name != 'pull_request' && secrets.FIREBASE_APP_ID != ''
        uses: wzieba/firebase-action@v1.7.0
        with:
          args: >
            crashlytics:symbols:upload
            --app=${{ secrets.FIREBASE_APP_ID }}
            ${{ env.SYMBOLS_DIR }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        continue-on-error: true

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/bundle/release/app-release.aab.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload split APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apks-split
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/flutter-apk/checksums.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload Debug Symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: |
            build/app/outputs/symbols.tar.gz
            build/app/outputs/symbols.tar.gz.sha256
          if-no-files-found: warn
          retention-days: 90

      - name: Build summary
        run: |
          {
            echo "## Build Summary (Obfuscated)"
            echo ""
            echo "**Version:** ${{ steps.version.outputs.full_version }}"
            echo "**Commit:** ${{ github.sha }}"
            echo "**Branch:** ${{ github.ref_name }}"
            echo "**Obfuscation:** Enabled ✅"
            echo "**R8 Full Mode:** Enabled ✅"
            echo "**Supabase Keys:** GitHub Secrets ✅"
            echo ""
            echo "### Artifacts"
            echo "- App Bundle (AAB)"
            APK_COUNT=$(ls -1 build/app/outputs/flutter-apk/*.apk 2>/dev/null | wc -l)
            echo "- APKs (split by ABI): $APK_COUNT files"
            echo "- Debug Symbols: Generated in \`symbols.tar.gz\`"
            echo ""
            echo "### Checksums"
            echo '```'
            cat build/app/outputs/bundle/release/app-release.aab.sha256
            cat build/app/outputs/flutter-apk/checksums.sha256
            if [ -f build/app/outputs/symbols.tar.gz.sha256 ]; then
              cat build/app/outputs/symbols.tar.gz.sha256
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(grep "^version:" pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            artifacts/app-release-aab/app-release.aab
            artifacts/app-release-aab/app-release.aab.sha256
            artifacts/app-release-apks-split/*.apk
            artifacts/app-release-apks-split/checksums.sha256
            artifacts/debug-symbols/symbols.tar.gz
            artifacts/debug-symbols/symbols.tar.gz.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [test-and-analyze, build, release]
    if: always() && (needs.test-and-analyze.result == 'failure' || needs.build.result == 'failure')
    timeout-minutes: 5

    steps:
      - name: Notify failure
        run: |
          {
            echo "## ❌ Build Failed"
            echo ""
            echo "**Workflow:** ${{ github.workflow }}"
            echo "**Run:** ${{ github.run_id }}"
            echo ""
            echo "[View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$GITHUB_STEP_SUMMARY"

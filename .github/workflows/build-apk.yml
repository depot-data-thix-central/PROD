name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub release'
        required: false
        default: 'false'
        type: boolean
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false  # ✅ Ne pas interrompre production

env:
  FLUTTER_VERSION: "3.24.0"
  JAVA_VERSION: "17"

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # JOB 1 : TESTS & ANALYSIS
  # ═══════════════════════════════════════════════════════════════════════
  test-and-analyze:
    name: Test & Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate code (build_runner)
        run: |
          if grep -q "build_runner" pubspec.yaml; then
            echo "🔨 Running build_runner..."
            dart run build_runner build --delete-conflicting-outputs
            if [ $? -ne 0 ]; then
              echo "❌ build_runner failed"
              exit 1
            fi
            echo "✅ build_runner completed"
          else
            echo "ℹ️ No build_runner — skip"
          fi

      - name: Analyze code
        run: |
          echo "🔍 Running flutter analyze..."
          flutter analyze --no-fatal-infos --no-fatal-warnings
          if [ $? -ne 0 ]; then
            echo "❌ Code analysis failed"
            exit 1
          fi
          echo "✅ Code analysis passed"

      - name: Run tests
        run: |
          echo "🧪 Running tests..."
          flutter test --coverage
          if [ $? -ne 0 ]; then
            echo "❌ Tests failed"
            exit 1
          fi
          echo "✅ All tests passed"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: flutter
          name: codecov-umbrella
          fail_ci_if_error: false
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════════════
  # JOB 2 : BUILD APK & AAB
  # ═══════════════════════════════════════════════════════════════════════
  build:
    name: Build Release
    runs-on: ubuntu-latest
    needs: test-and-analyze
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate code (build_runner)
        run: |
          if grep -q "build_runner" pubspec.yaml; then
            echo "🔨 Running build_runner..."
            dart run build_runner build --delete-conflicting-outputs
            if [ $? -ne 0 ]; then
              echo "❌ build_runner failed"
              exit 1
            fi
            echo "✅ build_runner completed"
          else
            echo "ℹ️ No build_runner — skip"
          fi

      - name: Setup Android keystore
        if: github.event_name != 'pull_request'
        run: |
          echo "🔐 Setting up Android keystore..."
          mkdir -p android/app
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=keystore.jks
          EOF
          echo "✅ Keystore configured"

      - name: Extract version from pubspec
        id: version
        run: |
          VERSION=$(grep "^version:" pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          BUILD_NUMBER=$(grep "^version:" pubspec.yaml | awk '{print $2}' | cut -d'+' -f2)

          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "full_version=$VERSION+$BUILD_NUMBER" >> $GITHUB_OUTPUT

          echo "📦 Version: $VERSION (build $BUILD_NUMBER)"

      - name: Build release App Bundle
        run: |
          echo "🔨 Building App Bundle..."
          flutter build appbundle --release \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ steps.version.outputs.build_number }}

          if [ $? -ne 0 ]; then
            echo "❌ App Bundle build failed"
            exit 1
          fi
          echo "✅ App Bundle built successfully"

      - name: Build release APKs (split by ABI)
        run: |
          echo "🔨 Building APKs (split by ABI)..."
          flutter build apk --release --split-per-abi \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ steps.version.outputs.build_number }}

          if [ $? -ne 0 ]; then
            echo "❌ APK build failed"
            exit 1
          fi
          echo "✅ APKs built successfully"

      - name: Verify artifacts
        run: |
          echo "🔍 Verifying artifacts..."

          if [ ! -f "build/app/outputs/bundle/release/app-release.aab" ]; then
            echo "❌ AAB not found"
            exit 1
          fi

          APK_COUNT=$(ls -1 build/app/outputs/flutter-apk/*.apk 2>/dev/null | wc -l)
          if [ $APK_COUNT -eq 0 ]; then
            echo "❌ No APKs found"
            exit 1
          fi

          echo "✅ Found 1 AAB and $APK_COUNT APKs"

      - name: Generate checksums
        run: |
          echo "🔐 Generating checksums..."

          cd build/app/outputs

          sha256sum bundle/release/app-release.aab > bundle/release/app-release.aab.sha256

          cd flutter-apk
          sha256sum *.apk > checksums.sha256

          echo "✅ Checksums generated"

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/bundle/release/app-release.aab.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload split APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apks-split
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/flutter-apk/checksums.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        run: |
          echo "## 📦 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.full_version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ App Bundle (AAB)" >> $GITHUB_STEP_SUMMARY

          APK_COUNT=$(ls -1 build/app/outputs/flutter-apk/*.apk 2>/dev/null | wc -l)
          echo "- ✅ APKs (split by ABI): $APK_COUNT files" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Checksums" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat build/app/outputs/bundle/release/app-release.aab.sha256 >> $GITHUB_STEP_SUMMARY
          cat build/app/outputs/flutter-apk/checksums.sha256 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════════════════
  # JOB 3 : RELEASE (optionnel)
  # ═══════════════════════════════════════════════════════════════════════
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(grep "^version:" pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            artifacts/app-release-aab/app-release.aab
            artifacts/app-release-aab/app-release.aab.sha256
            artifacts/app-release-apks-split/*.apk
            artifacts/app-release-apks-split/checksums.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          echo "## 🚀 Release Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Release published successfully!" >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════════════════
  # JOB 4 : NOTIFICATIONS (sur échec)
  # ═══════════════════════════════════════════════════════════════════════
  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [test-and-analyze, build, release]
    if: always() && (needs.test-and-analyze.result == 'failure' || needs.build.result == 'failure')
    timeout-minutes: 5

    steps:
      - name: Notify failure
        run: |
          echo "## ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow:** ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Failed Jobs" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.test-and-analyze.result }}" == "failure" ]; then
            echo "- ❌ Test & Analyze" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.build.result }}" == "failure" ]; then
            echo "- ❌ Build" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔍 [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

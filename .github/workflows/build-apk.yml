
name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub release'
        required: false
        default: 'false'
        type: boolean
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "17"

jobs:
  test-and-analyze:
    name: Test & Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate code (build_runner)
        run: |
          if grep -q "build_runner" pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          else
            echo "No build_runner — skip"
          fi

      - name: Analyze code
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Run tests
        continue-on-error: true
        run: flutter test --coverage || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: flutter
          name: codecov-umbrella
          fail_ci_if_error: false
        continue-on-error: true

  build:
    name: Build Release
    runs-on: ubuntu-latest
    needs: test-and-analyze
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate code (build_runner)
        run: |
          if grep -q "build_runner" pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          else
            echo "No build_runner — skip"
          fi

      - name: Setup Android keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          echo "Setting up Android keystore..."

          if [ -z "${KEYSTORE_B64}" ]; then
            echo "Secret ANDROID_KEYSTORE_BASE64 is empty."
            exit 1
          fi
          if [ -z "${STORE_PASSWORD}" ] || [ -z "${KEY_PASSWORD}" ] || [ -z "${KEY_ALIAS}" ]; then
            echo "Missing ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD or ANDROID_KEY_ALIAS."
            exit 1
          fi

          mkdir -p android/app

          # Strip whitespace/newlines then decode (avoids "base64: invalid input")
          printf '%s' "${KEYSTORE_B64}" | tr -d '\n\r\t ' | base64 --decode > android/app/keystore.jks

          if [ ! -s android/app/keystore.jks ]; then
            echo "Decoded keystore is empty. Check ANDROID_KEYSTORE_BASE64."
            exit 1
          fi

          # No leading spaces in key.properties (they break signing)
          cat > android/key.properties <<EOF
          storePassword=${STORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=keystore.jks
          EOF

          # Remove accidental leading spaces from the heredoc above
          sed -i 's/^[[:space:]]*//' android/key.properties

          echo "Keystore configured ($(wc -c < android/app/keystore.jks) bytes)"

      - name: Extract version from pubspec
        id: version
        run: |
          VERSION=$(grep "^version:" pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          BUILD_NUMBER=$(grep "^version:" pubspec.yaml | awk '{print $2}' | cut -d'+' -f2)

          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "full_version=$VERSION+$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (build $BUILD_NUMBER)"

      - name: Build release App Bundle
        run: |
          flutter build appbundle --release \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ steps.version.outputs.build_number }}

      - name: Build release APKs (split by ABI)
        run: |
          flutter build apk --release --split-per-abi \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ steps.version.outputs.build_number }}

      - name: Verify artifacts
        run: |
          test -f build/app/outputs/bundle/release/app-release.aab
          APK_COUNT=$(ls -1 build/app/outputs/flutter-apk/*.apk 2>/dev/null | wc -l)
          test "$APK_COUNT" -gt 0
          echo "Found 1 AAB and $APK_COUNT APKs"

      - name: Generate checksums
        run: |
          cd build/app/outputs
          sha256sum bundle/release/app-release.aab > bundle/release/app-release.aab.sha256
          cd flutter-apk
          sha256sum *.apk > checksums.sha256

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/bundle/release/app-release.aab.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload split APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apks-split
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/flutter-apk/checksums.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        run: |
          {
            echo "## Build Summary"
            echo ""
            echo "**Version:** ${{ steps.version.outputs.full_version }}"
            echo "**Commit:** ${{ github.sha }}"
            echo "**Branch:** ${{ github.ref_name }}"
            echo ""
            echo "### Artifacts"
            echo "- App Bundle (AAB)"
            APK_COUNT=$(ls -1 build/app/outputs/flutter-apk/*.apk 2>/dev/null | wc -l)
            echo "- APKs (split by ABI): $APK_COUNT files"
            echo ""
            echo "### Checksums"
            echo '```'
            cat build/app/outputs/bundle/release/app-release.aab.sha256
            cat build/app/outputs/flutter-apk/checksums.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(grep "^version:" pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            artifacts/app-release-aab/app-release.aab
            artifacts/app-release-aab/app-release.aab.sha256
            artifacts/app-release-apks-split/*.apk
            artifacts/app-release-apks-split/checksums.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [test-and-analyze, build, release]
    if: always() && (needs.test-and-analyze.result == 'failure' || needs.build.result == 'failure')
    timeout-minutes: 5

    steps:
      - name: Notify failure
        run: |
          {
            echo "## Build Failed"
            echo ""
            echo "**Workflow:** ${{ github.workflow }}"
            echo "**Run:** ${{ github.run_id }}"
            echo ""
            echo "[View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$GITHUB_STEP_SUMMARY"

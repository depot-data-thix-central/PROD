# ═══════════════════════════════════════════════════════════════════════
# THIX ID — RELEASE SHOREBIRD (OTA)
#
# SEUL workflow autorisé à produire des binaires distribués aux utilisateurs
# (AAB Play Store + APK GitHub Release). Ces builds peuvent recevoir des
# patchs Dart OTA via shorebird-patch.yml.
#
# Déclenchement :
#   - tag v*  → release + GitHub Release automatique
#   - manuel  → release (+ GitHub Release si create_release=true)
#
# ⚠️ Règles :
#   - pubspec.yaml est la SOURCE DE VÉRITÉ de la version (X.Y.Z+B).
#     Le tag doit correspondre : v3.5.1 ↔ version: 3.5.1+26 (vérifié).
#   - Chaque version ne peut être released qu'UNE FOIS côté Shorebird.
#   - shorebird.yaml (app_id) doit être committé (`shorebird init`).
# ═══════════════════════════════════════════════════════════════════════
name: Shorebird Release (OTA)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub release (APK OTA)'
        required: false
        default: true
        type: boolean

concurrency:
  group: shorebird-release-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "17"
  # Version Flutter de Shorebird (stable actuelle). La release ET tous ses
  # patchs futurs seront liés à cette version. Ne la changez qu'en bumpant
  # la version de l'app (nouvelle release).
  FLUTTER_VERSION: "3.47.9"
  SYMBOLS_DIR: "build/app/outputs/symbols"
  SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

jobs:
  test-and-analyze:
    name: Test & Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('**/pubspec.lock') }}

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate code (build_runner)
        run: |
          if grep -q "build_runner" pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          else
            echo "No build_runner — skip"
          fi

      - name: Analyze code
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Run tests
        continue-on-error: true
        run: flutter test --coverage || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: flutter
          name: codecov-umbrella
          fail_ci_if_error: false
        continue-on-error: true

  release:
    name: Build & Publish (Shorebird OTA)
    runs-on: ubuntu-latest
    needs: test-and-analyze
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Flutter "stock" : sert uniquement à pub get + build_runner (codegen).
      # Le build release lui-même utilise le Flutter de Shorebird (même version).
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('**/pubspec.lock') }}

      - name: Flutter version
        run: flutter --version

      - name: Flutter pub get
        run: flutter pub get

      - name: Patch plugins (jcenter, compileSdk, namespace, Kotlin)
        run: |
          set -euo pipefail
          PUB_DIR="${PUB_CACHE:-$HOME/.pub-cache}/hosted/pub.dev"

          # 1. jcenter() supprimé dans Gradle 9
          grep -rl "jcenter()" "$PUB_DIR" --include=build.gradle --include=build.gradle.kts 2>/dev/null \
            | xargs -r sed -i 's/jcenter()/mavenCentral()/g'

          # 2. compileSdkVersion < 30 -> 36
          grep -rlE "compileSdkVersion[[:space:]]+(1[0-9]|2[0-9])\b" "$PUB_DIR" --include=build.gradle 2>/dev/null \
            | xargs -r sed -i -E 's/compileSdkVersion[[:space:]]+(1[0-9]|2[0-9])\b/compileSdkVersion 36/g'

          # 3. flutter_app_badger legacy manifest: AGP 8+ forbids package= in library manifests.
          #    Its namespace must be declared in build.gradle instead.
          for manifest in "$PUB_DIR"/flutter_app_badger-*/android/src/main/AndroidManifest.xml; do
            if [ -f "$manifest" ]; then
              sed -i -E 's/[[:space:]]+package="[^"]+"//g' "$manifest"
            fi
          done

          for f in "$PUB_DIR"/flutter_app_badger-*/android/build.gradle; do
            if [ -f "$f" ]; then
              if ! grep -q "compileSdkVersion" "$f"; then
                sed -i '0,/android[[:space:]]*{/s//android {\n    compileSdkVersion 36/' "$f"
              fi
              if ! grep -q "namespace" "$f"; then
                sed -i '0,/android[[:space:]]*{/s//android {\n    namespace "fr.g123k.flutterappbadge.flutterappbadger"/' "$f"
              fi
            fi
          done

          # 4. Kotlin languageVersion/apiVersion 1.x -> 2.0 (Kotlin 2.2 refuse 1.6)
          grep -rlE "(languageVersion|apiVersion)|KOTLIN_1_" "$PUB_DIR" --include=build.gradle --include=build.gradle.kts 2>/dev/null \
            | xargs -r sed -i -E \
              -e "s/(languageVersion|apiVersion)([[:space:]]*=[[:space:]]*|[[:space:]]+)[\"']1\.[0-9]+[\"']/\1\2\"2.0\"/g" \
              -e 's/KOTLIN_1_[0-9]+/KOTLIN_2_0/g'

          echo "=== sentry_flutter (Kotlin) ==="
          grep -nE "languageVersion|apiVersion|jvmTarget|KOTLIN_" "$PUB_DIR"/sentry_flutter-*/android/build.gradle || true

          echo "=== flutter_app_badger ==="
          cat "$PUB_DIR"/flutter_app_badger-*/android/build.gradle || true
          cat "$PUB_DIR"/flutter_app_badger-*/android/src/main/AndroidManifest.xml || true

      - name: Generate code (build_runner)
        run: |
          if grep -q "build_runner" pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          else
            echo "No build_runner — skip"
          fi

      - name: Setup Android keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          echo "Setting up Android keystore..."

          if [ -z "${KEYSTORE_B64}" ]; then
            echo "Secret ANDROID_KEYSTORE_BASE64 is empty."
            exit 1
          fi
          if [ -z "${STORE_PASSWORD}" ] || [ -z "${KEY_PASSWORD}" ] || [ -z "${KEY_ALIAS}" ]; then
            echo "Missing ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD or ANDROID_KEY_ALIAS."
            exit 1
          fi

          mkdir -p android/app

          printf '%s' "${KEYSTORE_B64}" | tr -d '\n\r\t ' | base64 --decode > android/app/keystore.jks

          if [ ! -s android/app/keystore.jks ]; then
            echo "Decoded keystore is empty. Check ANDROID_KEYSTORE_BASE64."
            exit 1
          fi

          cat > android/key.properties <<EOF
          storePassword=${STORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=keystore.jks
          EOF

          sed -i 's/^[[:space:]]*//' android/key.properties
          echo "Keystore configured ($(wc -c < android/app/keystore.jks) bytes)"

      - name: 🐦 Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      # ── GARDE-FOUS : shorebird.yaml présent + tag aligné sur pubspec ──
      - name: Verify Shorebird config & version
        id: version
        run: |
          set -euo pipefail

          if [ ! -f shorebird.yaml ]; then
            echo "::error::shorebird.yaml manquant. Lancez 'shorebird init' en local et committez le fichier."
            exit 1
          fi

          PUBSPEC_VERSION=$(grep "^version:" pubspec.yaml | awk '{print $2}')
          VERSION=${PUBSPEC_VERSION%%+*}
          BUILD_NUMBER=${PUBSPEC_VERSION##*+}

          if [[ ! "$PUBSPEC_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "::error::Version pubspec invalide: '$PUBSPEC_VERSION' (attendu X.Y.Z+B)"
            exit 1
          fi

          # Le tag DOIT correspondre au pubspec (fin de la dérive tag/version).
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            if [[ "$TAG_VERSION" != "$VERSION" ]]; then
              echo "::error::Tag v$TAG_VERSION ≠ pubspec $PUBSPEC_VERSION. Alignez pubspec.yaml (version: $TAG_VERSION+XX) AVANT de tagger."
              exit 1
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "full_version=$PUBSPEC_VERSION" >> "$GITHUB_OUTPUT"
          echo "Release Shorebird: $PUBSPEC_VERSION (Flutter $FLUTTER_VERSION)"

      # ── BUILD + ENREGISTREMENT DE LA RELEASE CHEZ SHOREBIRD ──
      # --artifact apk → produit AAB (Play Store) + APK universel (GitHub).
      # PAS de --split-per-abi : incompatible Shorebird (versionCode par split).
      # Les --dart-define sont enregistrés par Shorebird : tout patch devra
      # utiliser EXACTEMENT les mêmes valeurs.
      - name: 🚀 Shorebird Release (AAB + APK, obfuscated)
        run: |
          shorebird release android \
            --flutter-version=${{ env.FLUTTER_VERSION }} \
            --artifact apk \
            --obfuscate \
            --split-debug-info=${{ env.SYMBOLS_DIR }} \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            -- --android-skip-build-dependency-validation

      - name: Locate artifacts, checksums & symbols
        id: artifacts
        run: |
          set -euo pipefail

          AAB=$(find build/app/outputs -type f -name "app-release.aab" | head -n1)
          APK=$(find build/app/outputs -type f -name "app-release.apk" | head -n1)

          if [ -z "$AAB" ]; then
            echo "::error::AAB introuvable après shorebird release."
            find build/app/outputs -type f | head -50
            exit 1
          fi
          if [ -z "$APK" ]; then
            echo "::error::APK introuvable après shorebird release (--artifact apk)."
            find build/app/outputs -type f | head -50
            exit 1
          fi

          echo "aab_path=$AAB" >> "$GITHUB_OUTPUT"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "AAB: $AAB"
          echo "APK: $APK"

          sha256sum "$AAB" > "$AAB.sha256"
          sha256sum "$APK" > "$APK.sha256"

          if [ -d "$SYMBOLS_DIR" ] && [ -n "$(ls -A "$SYMBOLS_DIR")" ]; then
            tar -czf build/app/outputs/symbols.tar.gz \
              -C "$(dirname "$SYMBOLS_DIR")" "$(basename "$SYMBOLS_DIR")"
            sha256sum build/app/outputs/symbols.tar.gz > build/app/outputs/symbols.tar.gz.sha256
            ls -lh build/app/outputs/symbols.tar.gz
          else
            echo "⚠️ WARNING: No symbols found in $SYMBOLS_DIR"
          fi

      - name: Upload App Bundle (OTA)
        uses: actions/upload-artifact@v4
        with:
          name: shorebird-aab
          path: |
            ${{ steps.artifacts.outputs.aab_path }}
            ${{ steps.artifacts.outputs.aab_path }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK universel (OTA)
        uses: actions/upload-artifact@v4
        with:
          name: shorebird-apk
          path: |
            ${{ steps.artifacts.outputs.apk_path }}
            ${{ steps.artifacts.outputs.apk_path }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload Debug Symbols
        uses: actions/upload-artifact@v4
        with:
          name: shorebird-symbols
          path: |
            build/app/outputs/symbols.tar.gz
            build/app/outputs/symbols.tar.gz.sha256
          if-no-files-found: warn
          retention-days: 90

      - name: Create GitHub Release
        if: |
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          body: |
            ## ✅ Build Shorebird OTA — THIX ID ${{ steps.version.outputs.full_version }}

            - **AAB** → à uploader sur la Play Console (build patchable OTA).
            - **APK universel** → distribution directe (WhatsApp, site, GitHub).
              Les appareils installés via cet APK reçoivent les patchs Dart OTA.
            - Correctif Dart sans store : workflow **Shorebird Patch (OTA)**
              avec `release_version=${{ steps.version.outputs.full_version }}`.
          files: |
            ${{ steps.artifacts.outputs.aab_path }}
            ${{ steps.artifacts.outputs.aab_path }}.sha256
            ${{ steps.artifacts.outputs.apk_path }}
            ${{ steps.artifacts.outputs.apk_path }}.sha256
            build/app/outputs/symbols.tar.gz
            build/app/outputs/symbols.tar.gz.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          {
            echo "## 🐦 Shorebird Release"
            echo ""
            echo "**Version:** ${{ steps.version.outputs.full_version }}"
            echo "**Flutter:** ${{ env.FLUTTER_VERSION }}"
            echo ""
            echo "### Prochaines étapes"
            echo "1. Uploader l'AAB sur la Play Console."
            echo "2. Distribuer l'APK universel (GitHub Release)."
            echo "3. Pour un hotfix Dart : workflow « Shorebird Patch (OTA) »"
            echo "   avec release_version = ${{ steps.version.outputs.full_version }}"
          } >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [test-and-analyze, release]
    if: always() && (needs.test-and-analyze.result == 'failure' || needs.release.result == 'failure')
    timeout-minutes: 5

    steps:
      - name: Notify failure
        run: |
          {
            echo "## ❌ Shorebird Release Failed"
            echo ""
            echo "**Workflow:** ${{ github.workflow }}"
            echo "**Run:** ${{ github.run_id }}"
            echo ""
            echo "[View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$GITHUB_STEP_SUMMARY"

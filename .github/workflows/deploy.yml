name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-web-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}

      - name: Enable Web
        run: flutter config --enable-web

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: |
          if grep -q "build_runner" pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          else
            echo "No build_runner — skip"
          fi

      # ✅ FIX : Secrets passés via env intermédiaire pour éviter la corruption
      # des caractères spéciaux (+, /, =) dans la clé JWT par le shell bash
      # ❌ SUPPRIMÉ : step "Create .env file" avec clés en dur (inutile + risque sécurité)
      - name: Build Web
        env:
          D_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          D_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build web --release \
            --base-href /PROD/ \
            --dart-define=SUPABASE_URL="$D_SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$D_SUPABASE_ANON_KEY"

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: true

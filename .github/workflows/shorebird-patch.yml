# ═══════════════════════════════════════════════════════════════════════
# THIX ID — PATCH SHOREBIRD (OTA)
#
# Pousse un correctif du code Dart vers UNE release existante, sans store.
#
# ⚠️ PROCÉDURE OBLIGATOIRE :
#   1. Créer une branche hotfix DEPUIS LE TAG de la release :
#        git checkout -b hotfix/3.5.1 v3.5.1
#   2. Y appliquer UNIQUEMENT des changements Dart (pas de plugin, pas
#      d'asset, pas de natif, pas de changement de version pubspec).
#   3. Pousser la branche, puis lancer ce workflow DEPUIS cette branche
#      (sélecteur de branche dans l'UI « Run workflow »).
#   4. track=staging d'abord → tester (shorebird preview) → promouvoir
#      via shorebird-promote.yml.
#
# Les --dart-define DOIVENT être identiques à ceux de la release patchée
# (Shorebird les enregistre et vérifie automatiquement).
# ═══════════════════════════════════════════════════════════════════════
name: Shorebird Patch (OTA)

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version EXACTE de la release installée (ex: 3.5.1+26)'
        required: true
        type: string
      track:
        description: 'Canal de publication (staging = test, stable = tous)'
        required: true
        type: choice
        options: [staging, stable]
        default: staging
      rollout:
        description: '% des appareils du canal (1 à 100)'
        required: false
        default: '100'
        type: string
      dry_run:
        description: 'Build + vérification SANS publier'
        required: false
        default: false
        type: boolean

concurrency:
  group: shorebird-patch-${{ github.event.inputs.release_version }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "17"
  # Doit correspondre au Flutter de la release patchée (codegen identique).
  # Le patch lui-même utilise automatiquement le Flutter de la release.
  FLUTTER_VERSION: "3.47.9"
  SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

jobs:
  patch:
    name: Patch ${{ github.event.inputs.release_version }} → ${{ github.event.inputs.track }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout (branche hotfix sélectionnée)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('**/pubspec.lock') }}

      - name: Flutter pub get
        run: flutter pub get

      - name: Patch plugins (jcenter, compileSdk, namespace, Kotlin)
        run: |
          set -euo pipefail
          PUB_DIR="${PUB_CACHE:-$HOME/.pub-cache}/hosted/pub.dev"

          # 1. jcenter() supprimé dans Gradle 9
          grep -rl "jcenter()" "$PUB_DIR" --include=build.gradle --include=build.gradle.kts 2>/dev/null \
            | xargs -r sed -i 's/jcenter()/mavenCentral()/g'

          # 2. compileSdkVersion < 30 -> 36
          grep -rlE "compileSdkVersion[[:space:]]+(1[0-9]|2[0-9])\b" "$PUB_DIR" --include=build.gradle 2>/dev/null \
            | xargs -r sed -i -E 's/compileSdkVersion[[:space:]]+(1[0-9]|2[0-9])\b/compileSdkVersion 36/g'

          # 3. flutter_app_badger legacy manifest: AGP 8+ forbids package= in library manifests.
          for manifest in "$PUB_DIR"/flutter_app_badger-*/android/src/main/AndroidManifest.xml; do
            if [ -f "$manifest" ]; then
              sed -i -E 's/[[:space:]]+package="[^"]+"//g' "$manifest"
            fi
          done

          for f in "$PUB_DIR"/flutter_app_badger-*/android/build.gradle; do
            if [ -f "$f" ]; then
              if ! grep -q "compileSdkVersion" "$f"; then
                sed -i '0,/android[[:space:]]*{/s//android {\n    compileSdkVersion 36/' "$f"
              fi
              if ! grep -q "namespace" "$f"; then
                sed -i '0,/android[[:space:]]*{/s//android {\n    namespace "fr.g123k.flutterappbadge.flutterappbadger"/' "$f"
              fi
            fi
          done

          # 4. Kotlin languageVersion/apiVersion 1.x -> 2.0 (Kotlin 2.2 refuse 1.6)
          grep -rlE "(languageVersion|apiVersion)|KOTLIN_1_" "$PUB_DIR" --include=build.gradle --include=build.gradle.kts 2>/dev/null \
            | xargs -r sed -i -E \
              -e "s/(languageVersion|apiVersion)([[:space:]]*=[[:space:]]*|[[:space:]]+)[\"']1\.[0-9]+[\"']/\1\2\"2.0\"/g" \
              -e 's/KOTLIN_1_[0-9]+/KOTLIN_2_0/g'

      - name: Generate code (build_runner)
        run: |
          if grep -q "build_runner" pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          else
            echo "No build_runner — skip"
          fi

      # La signature DOIT être la même que celle de la release patchée.
      - name: Setup Android keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          echo "Setting up Android keystore..."

          if [ -z "${KEYSTORE_B64}" ]; then
            echo "Secret ANDROID_KEYSTORE_BASE64 is empty."
            exit 1
          fi
          if [ -z "${STORE_PASSWORD}" ] || [ -z "${KEY_PASSWORD}" ] || [ -z "${KEY_ALIAS}" ]; then
            echo "Missing ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD or ANDROID_KEY_ALIAS."
            exit 1
          fi

          mkdir -p android/app

          printf '%s' "${KEYSTORE_B64}" | tr -d '\n\r\t ' | base64 --decode > android/app/keystore.jks

          if [ ! -s android/app/keystore.jks ]; then
            echo "Decoded keystore is empty. Check ANDROID_KEYSTORE_BASE64."
            exit 1
          fi

          cat > android/key.properties <<EOF
          storePassword=${STORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=keystore.jks
          EOF

          sed -i 's/^[[:space:]]*//' android/key.properties
          echo "Keystore configured ($(wc -c < android/app/keystore.jks) bytes)"

      - name: 🐦 Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Validate inputs
        run: |
          set -euo pipefail
          RV="${{ github.event.inputs.release_version }}"
          if ! [[ "$RV" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "::error::release_version doit être au format X.Y.Z+B (ex: 3.5.1+26). Reçu: '$RV'"
            exit 1
          fi
          ROLLOUT="${{ github.event.inputs.rollout }}"
          if ! [[ "$ROLLOUT" =~ ^[0-9]+$ ]] || [ "$ROLLOUT" -lt 1 ] || [ "$ROLLOUT" -gt 100 ]; then
            echo "::error::rollout doit être un entier entre 1 et 100. Reçu: '$ROLLOUT'"
            exit 1
          fi
          if [ ! -f shorebird.yaml ]; then
            echo "::error::shorebird.yaml manquant sur cette branche."
            exit 1
          fi

      # ── PATCH OTA ──
      # --release-version est OBLIGATOIRE en CI (pas de guessing).
      # L'obfuscation et les flags de build sont hérités de la release.
      # --rollout : déploiement progressif (release Flutter ≥ 3.35.7 ✓).
      - name: 🩹 Shorebird Patch
        run: |
          shorebird patch android \
            --release-version=${{ github.event.inputs.release_version }} \
            --track=${{ github.event.inputs.track }} \
            --rollout=${{ github.event.inputs.rollout }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            -- --android-skip-build-dependency-validation

      - name: Summary
        if: always()
        run: |
          {
            echo "## 🩹 Shorebird Patch"
            echo ""
            echo "**Release:** ${{ github.event.inputs.release_version }}"
            echo "**Track:** ${{ github.event.inputs.track }}"
            echo "**Rollout:** ${{ github.event.inputs.rollout }} %"
            echo "**Dry-run:** ${{ github.event.inputs.dry_run }}"
            echo ""
            echo "### Validation staging"
            echo '```bash'
            echo "shorebird preview --track staging --release-version ${{ github.event.inputs.release_version }}"
            echo '```'
            echo "1er lancement : le patch se télécharge. Tuer + relancer : il est appliqué."
            echo ""
            echo "### Promotion vers tous les utilisateurs"
            echo "Workflow « Shorebird Promote / Rollback » → action=promote,"
            echo "release_version=${{ github.event.inputs.release_version }}, patch_number=(voir console Shorebird)."
          } >> "$GITHUB_STEP_SUMMARY"
